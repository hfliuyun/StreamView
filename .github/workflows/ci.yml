name: CI

on:
  push:
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qt-version: 6.11.1
          - os: windows-2022
            qt-version: 6.11.1
          - os: macos-15
            qt-version: 6.11.1
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install FFmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress
          $candidates = @(
            "C:\ProgramData\chocolatey\bin",
            "C:\ProgramData\chocolatey\lib\ffmpeg\tools\ffmpeg\bin"
          )
          foreach ($dir in $candidates) {
            if (Test-Path (Join-Path $dir "ffprobe.exe")) {
              Add-Content -Path $env:GITHUB_PATH -Value $dir
            }
          }

      - name: Verify FFprobe availability
        run: ffprobe -version

      - name: Install Qt
        if: runner.os != 'Windows'
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: ${{ matrix.qt-version }}
          cache: true

      - name: Set up Python for Windows Qt installation
        if: runner.os == 'Windows'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install Qt (Windows with retry)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check --quiet `
            'https://github.com/miurahr/aqtinstall/archive/076e1659807d0b362a3ed684d54c2e9c775eb9c7.zip' `
            'py7zr==1.1.4'

          $qtRoot = Join-Path $env:GITHUB_WORKSPACE 'Qt'
          $qtVersion = '${{ matrix.qt-version }}'
          $qtArch = 'win64_msvc2022_64'
          $qtPrefix = Join-Path $qtRoot "$qtVersion/msvc2022_64"
          $installed = $false

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "Installing Qt $qtVersion (attempt $attempt/3)"
            if (Test-Path $qtRoot) {
              Remove-Item -Recurse -Force $qtRoot
            }
            New-Item -ItemType Directory -Force $qtRoot | Out-Null
            python -m aqt install-qt windows desktop $qtVersion $qtArch `
              --autodesktop --outputdir $qtRoot
            if ($LASTEXITCODE -eq 0 -and (Test-Path (Join-Path $qtPrefix 'lib/cmake/Qt6/Qt6Config.cmake'))) {
              $installed = $true
              break
            }
            if ($attempt -lt 3) {
              Start-Sleep -Seconds (10 * $attempt)
            }
          }

          if (-not $installed) {
            throw "Qt $qtVersion installation failed after three attempts"
          }

          @(
            "CMAKE_PREFIX_PATH=$qtPrefix"
            "Qt6_DIR=$(Join-Path $qtPrefix 'lib/cmake/Qt6')"
            "QT_ROOT_DIR=$qtPrefix"
            "QT_PLUGIN_PATH=$(Join-Path $qtPrefix 'plugins')"
            "QML2_IMPORT_PATH=$(Join-Path $qtPrefix 'qml')"
          ) | Add-Content -Path $env:GITHUB_ENV
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $qtPrefix 'bin')

      - name: Enable MSVC x64 environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
          vsversion: 2022

      - name: Configure
        if: runner.os != 'Windows'
        run: cmake --preset ci -DSTREAMVIEW_BUILD_BENCHMARKS=ON

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $qtPrefix = Join-Path $env:GITHUB_WORKSPACE "Qt/${{ matrix.qt-version }}/msvc2022_64"
          $qtConfig = Join-Path $qtPrefix 'lib/cmake/Qt6/Qt6Config.cmake'
          if (-not (Test-Path $qtConfig)) {
            throw "Qt configuration was not found at $qtConfig"
          }
          cmake --preset ci `
            "-DCMAKE_PREFIX_PATH=$qtPrefix" `
            "-DQt6_DIR=$(Join-Path $qtPrefix 'lib/cmake/Qt6')" `
            "-DSTREAMVIEW_BUILD_BENCHMARKS=ON"

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        run: ctest --preset ci --output-on-failure

      - name: Measure release performance
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/run_performance.py \
            --binary "build/ci/benchmarks/streamview_benchmarks${{ runner.os == 'Windows' && '.exe' || '' }}" \
            --output build/ci/performance.json

      - name: Report Windows test failure
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $temporary = Join-Path $env:GITHUB_WORKSPACE 'build/ci/Testing/Temporary'
          $failedPath = Join-Path $temporary 'LastTestsFailed.log'
          $detailPath = Join-Path $temporary 'LastTest.log'
          $failed = if (Test-Path $failedPath) { Get-Content $failedPath } else { @('0:unknown-test') }
          $detail = if (Test-Path $detailPath) { Get-Content $detailPath } else { @('no CTest log') }
          foreach ($entry in $failed) {
            $testName = ($entry -split ':', 2)[-1]
            $start = 0
            for ($index = 0; $index -lt $detail.Count; $index++) {
              if ($detail[$index] -like "*Testing: $testName") {
                $start = $index
                break
              }
            }
            $end = $detail.Count - 1
            for ($index = $start + 1; $index -lt $detail.Count; $index++) {
              if ($detail[$index] -match '^\d+/\d+ Testing: ') {
                $end = $index - 1
                break
              }
            }
            $section = $detail[$start..$end]
            $summary = $section | Where-Object {
              $_ -match 'FAIL!|Loc:|Totals:|QFATAL|QWARN|SKIP|Exception|error'
            }
            if (-not $summary) {
              $summary = $section | Select-Object -Last 40
            }
            $message = ($summary -join "`n")
            if ($message.Length -gt 3500) {
              $message = $message.Substring(0, 3500)
            }
            $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=CTest $testName::$message"
          }
          exit 0

  sanitize:
    name: ASan / UBSan (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            leak-check: '1'
          - os: macos-15
            leak-check: '0'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=${{ matrix.leak-check }}
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: '6.11.1'
          cache: true

      - name: Configure
        run: cmake --preset sanitize

      - name: Build
        run: cmake --build --preset sanitize --parallel 2

      - name: Test all suites and fuzz corpus replays
        run: ctest --preset sanitize --parallel 2 --output-on-failure --timeout 600

      - name: Print failed test details
        if: failure()
        run: |
          for log in build/sanitize/Testing/Temporary/LastTestsFailed.log \
                     build/sanitize/Testing/Temporary/LastTest.log; do
            if test -f "$log"; then
              tail -n 200 "$log"
            fi
          done

  clang-tidy:
    name: LLVM 18 static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install pinned LLVM major
        run: |
          curl --fail --silent --show-error --location \
            https://apt.llvm.org/llvm-snapshot.gpg.key |
            sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-18 main" |
            sudo tee /etc/apt/sources.list.d/llvm-18.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y clang-18 clang-tidy-18 ninja-build
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: '6.11.1'
          cache: true
      - name: Configure and analyze project targets
        run: |
          clang++-18 --version
          clang-tidy-18 --version
          clang-tidy-18 --version | grep -E 'version 18\.1\.[89]([ .]|$)'
          cmake --preset clang-tidy \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DSTREAMVIEW_CLANG_TIDY_EXECUTABLE="$(command -v clang-tidy-18)" \
            -DSTREAMVIEW_BUILD_BENCHMARKS=ON
          cmake --build --preset clang-tidy --parallel 2
